<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Central de Qualidade simplificada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: réplica do app como está hoje (Bluezone v1.3: sidebar navy, fundo cinza-azulado, cards brancos rounded-xl), tema claro único */
:root{
  --side:#141A3C; --side-2:#232B57; --side-fg:#C9D1F2; --side-muted:#7D88B8;
  --primary:#0055FF; --primary-soft:#E8EFFF; --primary-dark:#0044CC;
  --bg:hsl(220 20% 97%); --card:#FFFFFF; --line:hsl(220 13% 90%); --muted-bg:hsl(220 14% 94%);
  --fg:hsl(228 40% 16%); --muted:#5E6785; --destructive:hsl(358 100% 45%);
  --red:#F87171; --amber:#F59E0B; --green:#16A34A; --violet:#7C3AED;
  --leve-bg:#E6F1FB; --leve:#378ADD; --media-bg:#FAEEDA; --media:#EF9F27; --grave-bg:#FCEBEB; --grave:#E24B4A; --gg-bg:#F7C1C1; --gg:#A32D2D;
  --coral:#FC6058; --coral-soft:#FFECEB;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{flex-shrink:0;display:inline-block;vertical-align:middle}

/* faixa do mockup */
.mock-band{background:var(--coral-soft);border-bottom:1px solid #F7C3BF;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#7A2420}
.mock-band .sp{flex:1}
.seg{display:inline-flex;background:#fff;border:1px solid #F2B3AE;border-radius:999px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#7A2420}
.seg button.on{background:var(--coral);color:#fff}

/* shell */
.app{display:flex;min-height:calc(100% - 38px)}
aside{width:228px;flex-shrink:0;background:var(--side);color:var(--side-fg);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;color:#fff;padding:2px 10px 10px}
.logo span{color:var(--coral)}
.sideseg{display:flex;background:var(--side-2);border-radius:999px;padding:2px;margin:0 6px 4px}
.sideseg button{flex:1;border:0;background:transparent;color:var(--side-fg);border-radius:999px;padding:5px 0;font-size:11.5px;font-weight:600}
.sideseg button.on{background:var(--coral);color:#fff}
.grp{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-fg);padding:7px 10px;border-radius:10px;font-size:13px}
.nav:hover{background:var(--side-2)}
.nav.on{background:#193CB8;color:#fff;font-weight:600}
.nav.out{color:#F5A29C;text-decoration:line-through;text-decoration-color:rgba(245,162,156,.7)}
.nav .flag{margin-left:auto;font-size:9.5px;font-weight:700;text-transform:uppercase;border-radius:999px;padding:1px 6px;background:rgba(252,96,88,.22);color:#FFB3AE;text-decoration:none;display:inline-block}
.side-sim{margin:12px 6px 0;border-top:1px solid var(--side-2);padding-top:12px}
.side-sim button{width:100%;border:1px solid #3A4380;background:transparent;color:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center;justify-content:center}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--side-muted);line-height:1.45}

main{flex:1;min-width:0;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){main{padding-left:40px;padding-right:40px}}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.iconbtn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.iconbtn .dotn{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--destructive)}

/* tipografia de página */
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2.sec{font-size:18px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}

/* botões "bonitinhos": pílula, ícone, sombra leve, estados claros */
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;height:34px;padding:0 14px;font-weight:600;font-size:12.5px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;box-shadow:0 1px 2px rgba(20,26,60,.06);color:var(--fg)}
.btn:hover{border-color:#B9C6E6;background:#FAFBFF}
.btn .i{color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(0,85,255,.25)}
.btn.pri .i{color:#fff}
.btn.pri:hover{background:var(--primary-dark)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.danger{background:#fff;border-color:#F3C1BD;color:var(--destructive)}
.btn.danger .i{color:var(--destructive)}
.btn.sm{height:28px;padding:0 11px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.gone{background:var(--coral-soft);border-color:#F3C1BD;color:#B4302A;text-decoration:line-through;box-shadow:none}
.btn.gone .i{color:#B4302A}
.bgroup{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(20,26,60,.06);overflow:hidden}
.bgroup .btn{border:0;border-radius:0;box-shadow:none;border-right:1px solid var(--line)}
.bgroup .btn:last-child{border-right:0}
.gone-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;background:#fff;border-radius:999px;padding:1px 6px;margin-left:2px}

/* abas */
.utabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.utab{border:0;background:transparent;padding:9px 1px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utab.on{color:var(--fg);font-weight:600;border-bottom-color:var(--primary)}
.ptabs{display:inline-flex;gap:2px;background:var(--muted-bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:18px;flex-wrap:wrap}
.ptab{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ptab.on{background:#fff;color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(20,26,60,.1)}
.ptab.out{color:#B4302A;text-decoration:line-through}
.pills{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* blocos */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{font-size:15px;font-weight:700;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.stack{display:grid;gap:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.g2>*,.g3>*,.g4>*,.g5>*{min-width:0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .l.up{text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;font-weight:700}
.kpi .v{font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.icon{display:flex;gap:12px;align-items:center}
.kpi.icon .sq{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kpi.icon .v{font-size:24px;margin-top:2px}
.trend{border-radius:999px;padding:1px 8px;font-weight:700;font-size:11px}
.trend.g{background:#DCFCE7;color:#15803D}.trend.r{background:#FEE2E2;color:#B91C1C}.trend.n{background:var(--muted-bg);color:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-blue{background:#DBEAFE;color:#1D4ED8}.b-amber{background:#FEF3C7;color:#B45309}.b-red{background:#FEE2E2;color:#B91C1C}.b-green{background:#DCFCE7;color:#15803D}.b-violet{background:#EDE9FE;color:#6D28D9}.b-gray{background:var(--muted-bg);color:var(--muted)}.b-dark{background:#141A3C;color:#fff}.b-solidamber{background:var(--amber);color:#fff}
.b-out{background:#fff;border:1px solid var(--line);color:var(--fg)}
.mono{font-family:var(--mono);font-size:11.5px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFD}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.35}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
table.blue th{background:var(--primary);color:#fff;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
table.zebra tbody tr:nth-child(even) td{background:#F8FAFD}
.lnk{color:var(--primary);font-weight:600;font-size:12.5px;display:inline-flex;gap:4px;align-items:center}

.inp{border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;padding:0 11px;font:inherit;font-size:13px;color:var(--fg);min-width:0}
textarea.inp{height:auto;padding:9px 11px;resize:vertical}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;padding:0 11px;flex:1 1 240px;max-width:420px;color:var(--muted)}
.search input{border:0;outline:0;font:inherit;font-size:13px;flex:1;min-width:0;background:transparent;color:var(--fg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mb{margin-bottom:14px}
.note{font-size:12px;color:var(--muted)}
.chipx{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:#fff}

/* period filter */
.period{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.period .months{display:flex;gap:5px;flex-wrap:wrap}
.period .m{border:0;background:var(--muted-bg);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.period .m.on{background:var(--primary);color:#fff}

/* kanban */
.kb-wrap{overflow-x:auto;padding-bottom:10px}
.kb{display:flex;gap:12px;min-width:min-content;align-items:flex-start}
.col{width:260px;flex-shrink:0;background:hsl(220 14% 94% / .6);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col.w300{width:290px}
.col h4{margin:0;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.cnt{font-family:var(--mono);font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.cdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.col.virtual{border:1px dashed #C5CDE0}
.acc{font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:center;padding:2px 4px}
.oc{background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;position:relative}
.oc .tt{font-size:12.5px;font-weight:700;padding-right:18px}
.oc .ln{display:flex;gap:6px;align-items:center;color:var(--muted)}
.oc .ln .i{color:#8A93B2}
.oc .ds{font-size:11px;color:var(--fg);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.oc .sc{font-family:var(--mono);font-size:10.5px;background:rgba(0,0,0,.05);border-radius:5px;padding:1px 5px;font-weight:700}
.oc .cat{font-size:10px;color:var(--muted);align-self:center}
.oc .gv{font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px}
.oc .warn{position:absolute;top:8px;right:8px;color:var(--amber)}
.oc .act{margin-top:4px}
.oc .act .btn{width:100%;justify-content:center}
.oc.api{border-style:dashed}
.sev-leve{background:var(--leve-bg);border-left-color:var(--leve)}.sev-media{background:var(--media-bg);border-left-color:var(--media)}.sev-grave{background:var(--grave-bg);border-left-color:var(--grave)}.sev-gg{background:var(--gg-bg);border-left-color:var(--gg)}
.gv-leve{background:#BFDBFE;color:#1E40AF}.gv-media{background:#FED7AA;color:#9A3412}.gv-grave{background:#FECACA;color:#991B1B}
.mc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.mc.dash{border-style:dashed}
.mc .tl{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:12.5px}
.mc .tl span:last-child{font-variant-numeric:tabular-nums}
.mc .ft{color:var(--muted);font-size:11.5px;display:flex;gap:5px;align-items:center}

/* barras de ranking */
.rk{display:grid;gap:9px}
.rk .it{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:12.5px}
.rk .pos{color:var(--primary);font-weight:700}
.rk .bar{grid-column:2/4;height:6px;background:var(--muted-bg);border-radius:999px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:rgba(0,85,255,.6);border-radius:999px}
.prog{height:6px;background:var(--muted-bg);border-radius:999px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;border-radius:999px}

/* risco de multa */
.rsec{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 6px;color:var(--muted)}
.rcard{border:1px solid;border-radius:10px;padding:9px 11px;display:grid;gap:6px;margin-bottom:7px;font-size:12.5px}
.rcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rcard .nm{font-weight:700}
.rc-red{background:#FEF2F2;border-color:#FECACA}.rc-amb{background:#FFFBEB;border-color:#FDE68A}

.chart svg{width:100%;height:auto;display:block}
.callout{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px dashed #B9CCFF;border-radius:12px;padding:9px 12px;font-size:12.5px;color:#123A9E;margin-bottom:14px;line-height:1.45}
.callout.red{border-color:#F3C1BD;color:#8A231D;background:#FFF8F7}
.callout .i{margin-top:1px}

/* form */
.form{display:grid;gap:14px;max-width:640px}
.form label{display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.form .inp{width:100%;background:hsl(220 14% 94% / .3)}
.yn{display:flex;gap:8px}
.yn button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700}
.yn button.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(0,85,255,.25)}
.ai{background:var(--primary-soft);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px;color:#123A9E;flex-wrap:wrap}
.drop{border:1.5px dashed #C5CDE0;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px;display:flex;gap:8px;justify-content:center;align-items:center}
.sumbox{background:var(--muted-bg);border-radius:10px;padding:11px 13px;font-size:13px;display:grid;gap:4px}

/* portal franquia */
.hero{border-radius:16px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;padding:32px;background:linear-gradient(120deg,#0D1544 0%,#193CB8 55%,#3E7BFF 100%)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 30%,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle at 70% 90%,rgba(252,96,88,.25),transparent 40%)}
.hero>div{position:relative;z-index:1;max-width:560px;color:#fff}
.hero h1{font-size:32px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0 0 20px;opacity:.9;line-height:1.5}
.hero .btn{background:#fff;color:var(--primary);border:0;height:42px;padding:0 20px;font-weight:700;letter-spacing:.02em}
.fblk{background:#fff;border:1px solid var(--line);border-top:4px solid;border-radius:12px;padding:14px 16px}
.fblk h3{display:flex;gap:10px;align-items:center;font-size:15px;margin:0 0 10px}
.fblk .sq{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.fitem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:12.5px;display:grid;gap:4px}
.welcome{background:linear-gradient(90deg,#EEF2FA,#E5ECFA);border-radius:14px;padding:18px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.welcome h1{margin:0;font-size:22px}
.welcome p{margin:3px 0 0;color:var(--muted)}
.welcome .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* lista da limpeza */
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st.out{background:#FEE2E2;color:#B91C1C}.st.keep{background:#DCFCE7;color:#15803D}.st.ask{background:#FEF3C7;color:#B45309}
.viewsbar{display:inline-block;height:6px;border-radius:999px;background:#A9C2FF;vertical-align:middle;margin-right:6px}

@media(max-width:820px){
  .app{flex-direction:column}
  aside{width:100%;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px max(16px,env(safe-area-inset-left,0px))}
  aside .grp,.side-foot,.logo,.side-sim{display:none}
  .sideseg{width:100%}
  .nav{width:auto;padding:6px 10px}
  .hero{padding:22px}.hero h1{font-size:25px}
}
@media(prefers-reduced-motion:no-preference){.nav,.btn,.utab,.ptab,.pill{transition:background .15s,color .15s,border-color .15s}}
</style>
</head>
<body>

<div class="mock-band">
  <strong>Mockup · limpeza da Central de Qualidade</strong>
  <span>Telas como estão hoje na Lovable, com dados fictícios. Em "Marcado", o que sai aparece riscado.</span>
  <span class="sp"></span>
  <div class="seg" role="tablist" aria-label="Visão">
    <button data-mode="admin" class="on">Menu Qualidade</button>
    <button data-mode="franquia">Menu da franquia</button>
    <button data-mode="lista">Lista da limpeza</button>
  </div>
</div>
<div class="app"><aside id="side"></aside><main id="main"></main></div>

<script>
(function(){

/* ---------- gráficos simples ---------- */
function pie(d){let a=-Math.PI/2,s=`<svg viewBox="0 0 320 170" role="img" aria-label="Gráfico de pizza">`;const tot=d.reduce((x,y)=>x+y[1],0);
  d.forEach(([l,v,c])=>{const b=a+v/tot*Math.PI*2,x1=85+70*Math.cos(a),y1=85+70*Math.sin(a),x2=85+70*Math.cos(b),y2=85+70*Math.sin(b);s+=`<path d="M85 85L${x1} ${y1}A70 70 0 ${b-a>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${c}" stroke="#fff" stroke-width="2"/>`;a=b});
  d.forEach(([l,v,c],i)=>{s+=`<rect x="178" y="${22+i*24}" width="10" height="10" rx="2" fill="${c}"/><text x="194" y="${31+i*24}" font-size="11" fill="#141A3C">${l.length>22?l.slice(0,21)+"…":l} · ${v}%</text>`});return s+"</svg>"}
function rank(n,v){const m=Math.max(...v);return `<div class="rk">${n.map((x,i)=>`<div class="it"><span class="pos">${i+1}º</span><span>${x}</span><strong>${v[i]}</strong><span></span><div class="bar"><i style="width:${v[i]/m*100}%"></i></div></div>`).join("")}</div>`}
function hbars(d){const m=Math.max(...d.map(x=>x[1]));return `<div class="rk">${d.map(([l,v])=>{const p=v/m,c=p>.8?"#DC2626":p>.5?"#EA580C":"#2563EB";return `<div class="it" style="grid-template-columns:150px 1fr auto"><span style="font-size:12px">${l}</span><div class="prog" style="height:14px;border-radius:4px"><i style="width:${p*100}%;background:${c};border-radius:4px"></i></div><strong>${v}</strong></div>`}).join("")}</div>`}
function bars3(){return `<svg viewBox="0 0 420 230" role="img" aria-label="Visão do mês"><g stroke="#E3E7F0" stroke-dasharray="3 3">${[0,1,2,3].map(i=>`<line x1="40" x2="410" y1="${30+i*50}" y2="${30+i*50}"/>`).join("")}</g>${[["Registradas",7,"#F87171"],["Descontadas",5,"#0055FF"],["Em iminência hoje",3,"#F59E0B"]].map(([l,v,c],i)=>{const h=v/8*150,x=110+i*80;return `<rect x="${x}" y="${180-h}" width="56" height="${h}" rx="5" fill="${c}"/><text x="${x+28}" y="${172-h}" font-size="14" font-weight="700" text-anchor="middle" fill="#141A3C">${v}</text><rect x="${60+i*120}" y="210" width="10" height="10" rx="2" fill="${c}"/><text x="${75+i*120}" y="219" font-size="11" fill="#5E6785">${l}</text>`}).join("")}<text x="215" y="198" font-size="11" text-anchor="middle" fill="#5E6785">Out · 2026</text></svg>`}

  <div class="card"><h3><span style="color:var(--primary)">${ic("checksq",16)}</span>Passo a passo no Claude</h3>${["Abra Configurações → Conectores","Clique em Adicionar conector personalizado","Cole o endereço do conector","Cole a chave quando pedir"].map((p,i)=>`<div class="row" style="padding:5px 0"><span style="width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">${i+1}</span>${p}</div>`).join("")}</div>

function pgSai(t,txt){return `<div class="ph"><div><h1>${t}</h1><p>Esta página sai do app.</p></div></div><div class="callout red">${ic("x",15)}<span>${txt}</span></div>`}

/* ---------- PORTAL DA FRANQUIA ---------- */
function simBar(){return `<div class="card mb row" style="background:var(--muted-bg);padding:9px 14px;margin-bottom:14px">${ic("eye",14)}<span class="note">Simular franquia</span><select class="inp" style="height:30px"><option>Franquia Atlântico</option></select></div>`}
function pgInicio(){
  return `${simBar()}<div class="hero mb" style="margin-bottom:22px"><div><h1>Ocorrências e Multas: Sua operação em dia</h1><p>Monitore sua pontuação, resolva pendências e acesse recursos de documentação da área de qualidade e fiscalização. Eficiência e transparência em um só lugar.</p><button class="btn">CONSULTAR MINHAS OCORRÊNCIAS ${ic("chev",15)}</button></div></div>
  <div style="max-width:980px;margin:0 auto"><div class="pills mb" style="margin-bottom:14px"><button class="pill ${S.ini==="oc"?"on":""}" data-ini="oc">Ocorrências por Categoria</button><button class="pill ${S.ini==="mu"?"on":""}" data-ini="mu">Critérios de Multas</button></div>
  ${S.ini==="oc"?`<div class="card" style="padding:0;overflow:hidden"><table class="blue zebra"><thead><tr><th>Código</th><th>Descrição</th><th>Gravidade</th><th class="r">Pontos</th></tr></thead><tbody>${[["3.4","Desrespeito ou ofensa ao hóspede","Grave",4],["3.7","Atraso no check-in","Grave",4],["5.2","Limpeza abaixo do padrão","Média",2],["2.2","Implantação","Média",2]].map(r=>`<tr><td style="color:var(--primary);font-weight:700">${r[0]}</td><td>${r[1]}</td><td><span class="badge b-amber">${r[2]}</span></td><td class="r">${r[3]}</td></tr>`).join("")}</tbody></table></div>`
  :`<div class="card" style="padding:0;overflow:hidden"><table class="blue"><thead><tr><th>Porte</th><th class="r">Limiar (90 dias)</th><th class="r">Aviso de iminência</th></tr></thead><tbody><tr><td>P</td><td class="r">8 pts</td><td class="r">a partir de 4</td></tr><tr><td>M</td><td class="r">14 pts</td><td class="r">a partir de 10</td></tr><tr><td>G</td><td class="r">20 pts</td><td class="r">a partir de 16</td></tr></tbody></table></div>`}</div>`;
}

  <div class="ptabs"><button class="ptab on">${ic("chart",15)}Visão Geral</button><button class="ptab">${ic("trend",15)}Evolução</button></div>
  <div class="g2">
   <div class="fblk" style="border-top-color:#DC2626"><h3><span class="sq" style="background:#FEE2E2;color:#DC2626">${ic("msg",16)}</span>Chamados pendentes de resposta</h3><p class="note" style="margin:-4px 0 10px">2 chamados aguardando sua resposta</p>
   ${[["Em aberto","Implantação","20/10/2026","há 3 dias"],["Aguardando franquia","Limpeza","24/10/2026","há 1 dia"]].map(r=>`<div class="fitem"><div class="row" style="justify-content:space-between"><span class="lnk">${ic("ext",12)}Chamado</span><span class="badge b-amber">${r[0]}</span></div><span>${r[1]}</span><span class="note">Abertura: ${r[2]} · Última interação: ${r[3]}</span></div>`).join("")}</div>
   <div class="fblk" style="border-top-color:#0055FF"><h3><span class="sq" style="background:#DBEAFE;color:#0055FF">${ic("file",16)}</span>Ocorrências deste mês</h3><div class="pills mb" style="margin-bottom:10px">${["Todas (3)","Leve","Média","Grave","Gravíssima"].map((x,i)=>`<button class="pill ${i===0?"on":""}" style="padding:4px 10px;font-size:11.5px">${x}</button>`).join("")}</div>
   <div class="rsec" style="margin-top:0">Com pontuação</div>${[["27/10/2026","Implantação","Imóvel entregue sem enxoval completo.","Média","b-amber"]].map(r=>`<div class="fitem"><div class="row" style="justify-content:space-between"><span class="note">${r[0]} · ${r[1]}</span><span class="badge ${r[4]}">${r[3]}</span></div><span>${r[2]}</span><span class="lnk">${ic("ext",12)}Chamado</span></div>`).join("")}
   <div class="rsec">Sem pontuação</div><div class="fitem"><div class="row" style="justify-content:space-between"><span class="note">12/10/2026 · Implantação</span><span class="badge b-blue">Leve</span></div><span>Fotos fora do padrão (justificada).</span></div></div>
   <div class="fblk" style="border-top-color:#EA580C"><h3><span class="sq" style="background:#FFEDD5;color:#EA580C">${ic("alert",16)}</span>Iminência de multa</h3><p class="note" style="margin:-4px 0 10px">1 franquia(s) em iminência</p><div class="fitem"><div class="row" style="justify-content:space-between"><strong>Pontuação acumulada</strong><span class="badge b-amber">10/14</span></div><span class="note">Falta 4 pontos para o próximo patamar</span><div class="prog"><i style="width:71%;background:#EA580C"></i></div></div></div>
   <div class="fblk" style="border-top-color:#64748B"><h3><span class="sq" style="background:var(--muted-bg);color:#64748B">${ic("gavel",16)}</span>Multas recebidas</h3><div class="fitem"><div class="row" style="justify-content:space-between"><strong>Multa direta · 11.6</strong><span class="badge b-gray">R$ 2.000,00</span></div><span class="note">29/10/2026 · 1 ocorrência</span></div></div>
  </div>`;
}
function pgComunicados(){
  return `<div class="ph"><div><h1><span style="color:var(--primary)">${ic("bell",20)}</span>Comunicados</h1></div></div>
  ${marc()?`<div class="callout">${ic("info",15)}<span>Fica, mas não recebe mais nada novo. Os comunicados vinham do "Enviar comunicados em lote", que sai do funil. A franquia continua vendo os comunicados antigos.</span></div>`:""}
  <div class="stack">${[["Comunicado Formal – Aplicação de Pontuação | Franquia Atlântico","Média","b-amber","2.2 — Implantação","27/10/2026 às 14:20",1],["Comunicado Formal – Aplicação de Pontuação | Franquia Atlântico","Grave","b-red","3.7 — Atraso no check-in","09/10/2026 às 10:05",0]].map(r=>`<div class="card" style="${r[5]?"background:#F3F7FF;border-color:#B9CCFF":""}"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="row" style="gap:8px">${r[5]?'<span class="cdot" style="background:var(--primary)"></span>':""}<strong>${r[0]}</strong></div><div class="row"><span class="note">${r[4]}</span>${r[5]?'<span class="badge b-blue">Novo</span>':'<span class="note">Lido</span>'}</div></div><div class="row" style="margin-top:8px"><span class="badge ${r[2]}">${r[1]}</span><span class="note">${r[3]}</span></div></div>`).join("")}</div>`;

/* ---------- LISTA ---------- */
function pgLista(){
  const rows=[["Menu Qualidade","Caça Ocorrência","out","A caça é feita pelo Claude."],["Menu Qualidade","Contestação","out","Decisão sua (29/10)."],["Menu Qualidade","Multas (em Processos de Qualidade)","out","Repete \"Dashboard de multas\"."],["Ocorrências · Funil","Botão \"Enviar comunicados em lote\"","out","Mandava e-mail para a franquia por fora da Central. Também movia os cards de Finalizados para Com Pontuação."],["Multas","Aba \"Multas Aplicadas\"","out","Mostra as mesmas multas do Histórico."],["Multas","Selo \"Em manutenção\"","out","Sobrou de outra fase."],["Menu da franquia","Chamados (chat no app)","out","Canal paralelo à Central de Atividades."],["Menu Qualidade","Elogios","keep","Decisão sua (29/10)."],["Menu Qualidade","MCP (Claude)","keep","Decisão sua (29/10)."],["Menu da franquia","Comunicados","ask","Sem o envio em lote, não recebe mais nada novo. Fica só com o histórico, ou sai?"]];
  const lbl={out:"Sai",keep:"Fica",ask:"Decidir"};
  const top=[["Ocorrências (funil)",188],["Login",159],["Dashboard da franquia",117],["Multas",95],["Comunicados",42],["KPIs",40],["Início da franquia",37],["Automação Sapron",34],["Cliente Oculto",21],["Gerencial",18]];
  return `<div class="ph"><div><h1>Lista da limpeza</h1><p>O app serve para validar, verificar e receber as ocorrências na base. A comunicação com a franquia fica só na Central de Atividades.</p></div></div>
  <div class="card mb" style="padding:0;margin-bottom:16px"><div class="tbl-wrap"><table><thead><tr><th>Onde</th><th>Item</th><th></th><th>Por quê</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="note">${r[0]}</td><td><strong>${r[1]}</strong></td><td><span class="st ${r[2]}">${lbl[r[2]]}</span></td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h3>Páginas mais abertas no último mês</h3><p class="sub">Analytics da Lovable, 29/09 a 29/10/2026, 1.089 visualizações. A Lovable só mostra as 10 primeiras. Todo o resto teve menos de 18 acessos.</p><table><tbody>${top.map(([l,v])=>`<tr><td>${l}</td><td class="r"><span class="viewsbar" style="width:${Math.round(v/188*160)}px"></span>${v}</td></tr>`).join("")}</tbody></table></div>`;
}

function render(){
  document.querySelectorAll(".mock-band .seg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
  renderSide();
  const p=S.page;let h;
  if(S.mode==="lista")h=pgLista();
  else if(S.mode==="franquia")h=p==="dashboard"?pgDashF():p==="comunicados"?pgComunicados():p==="chamados"?pgSai("Chamados","Chat entre franquia e Seazone dentro do app. A comunicação oficial é o chamado da Central de Atividades. Sai do menu e o sino deixa de avisar mensagens desse chat. Os chamados antigos ficam guardados no banco."):pgInicio();
  else h=({ocorrencias:pgOcorrencias,gerencial:pgGerencial,saude:pgSaude,co:pgCO,kpis:pgKpis,sapron:pgSapron,elogios:pgElogios,franquias:pgFranquias,mcp:pgMcp}[p]||(()=>p==="multas"?pgMultas(S.tabM):p==="registrar"?pgMultas("registrar"):p==="caca"?pgSai("Caça Ocorrência","A caça roda pelo Claude, que lê o Suporte Unificado, o Slack e o Sapron. Ele só abre card em Nova Ocorrência depois do seu \"abre\". O card continua entrando direto no funil."):p==="contest"?pgSai("Contestação","Sai por decisão sua."):p==="multas2"?pgSai("Multas","Abre a mesma página do \"Dashboard de multas\", em Administração."):pgOcorrencias()))();
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" aria-label="Ajuda">?</button><button class="iconbtn" aria-label="Notificações">${ic("bell",15)}<span class="dotn"></span></button></div>`+h;
  save();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.mode){S.mode=d.mode;if(d.mode==="franquia")S.page="inicio";if(d.mode==="admin")S.page="ocorrencias";render();return}
  if(d.show){S.show=d.show;if(S.show==="limpo"&&["caca","contest","multas2","chamados"].includes(S.page))S.page=S.mode==="franquia"?"inicio":"ocorrencias";if(S.show==="limpo"&&S.tabM==="aplicadas")S.tabM="dashboard";render();return}
  if(d.go){S.page=d.go;if(S.mode==="lista")S.mode=["inicio","dashboard","chamados","comunicados"].includes(d.go)?"franquia":"admin";render();return}
  if(d.to){S.tabO=d.to;render();return}
  if(d.tm){S.tabM=d.tm;S.page=d.tm==="registrar"?"registrar":"multas";render();return}
  if(d.ger){S.ger=d.ger;render();return}
  if(d.ini){S.ini=d.ini;render();return}
});
render();
})();
</script>
